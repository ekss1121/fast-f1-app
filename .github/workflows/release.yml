# Pushing a version tag is the one action that releases. Everything below
# follows from it. The ordering matters: a version on PyPI can never be
# replaced or reused, so every check that can fail must fail before anything
# leaves the runner.
#
# The filename of this workflow and the name of the `pypi` environment below
# are both registered with PyPI as part of the Trusted Publishing binding.
# Renaming either breaks publishing until the registration on PyPI is updated.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    name: Check the tag against the declared version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Compare the tag with the declared version
        # Releasing is deliberately manual, so the likeliest human error is
        # editing the version and tagging something else — or tagging without
        # editing at all. This runs first and cheapest, before any build.
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          declared_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "Tag:      ${GITHUB_REF_NAME} (version ${tag_version})"
          echo "Declared: ${declared_version}"
          if [ "${tag_version}" != "${declared_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the declared version ${declared_version}. Nothing was built or uploaded."
            exit 1
          fi
          echo "Tag and declared version agree."

  test:
    name: Tests
    needs: check-version
    # The same matrix pull requests run, not a restatement of it.
    uses: ./.github/workflows/tests.yml

  build:
    name: Build and validate the distributions
    needs: [check-version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build the wheel and source distribution
        run: uv build

      - name: Validate the distribution metadata
        # --strict, so a warning about the rendered readme fails the release
        # rather than surfacing on an index page that can never be corrected.
        run: uvx twine check --strict dist/*

      - name: Hand the validated artefacts to the later jobs
        # Published later from this upload, never rebuilt, so what ships is
        # byte-for-byte what was validated here.
        uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scopes the ability to publish to this job alone. No required reviewers:
    # pushing the tag was already the human decision.
    environment:
      name: pypi
      url: https://pypi.org/p/fast-f1-app
    permissions:
      # Trusted Publishing over OIDC. No API token exists to leak.
      id-token: write

    steps:
      - name: Fetch the validated artefacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    name: Create the GitHub Release
    # Only after the upload succeeds, so a Release can never advertise a
    # version that is not on the index.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Fetch the validated artefacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
