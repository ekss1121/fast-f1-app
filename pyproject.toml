[project]
name = "fast-f1-app"
version = "0.1.0"
description = "Textual app for browsing current-season Formula 1 results with FastF1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.7.0",
    "plotext>=5.3.2",
    "textual>=0.89.1",
]

[project.scripts]
fast-f1-app = "fast_f1_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
