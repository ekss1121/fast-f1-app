[project]
name = "fast-f1-app"
version = "0.1.0"
description = "Textual app for browsing current-season Formula 1 results with FastF1"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhihang Liu" }]
keywords = ["formula1", "f1", "fastf1", "motorsport", "textual", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "fastf1>=3.7.0",
    "plotext>=5.3.2",
    "textual>=0.89.1",
]

[project.urls]
Homepage = "https://github.com/ekss1121/fast-f1-app"
Repository = "https://github.com/ekss1121/fast-f1-app"
Issues = "https://github.com/ekss1121/fast-f1-app/issues"

[project.scripts]
fast-f1-app = "fast_f1_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Without this, hatchling sweeps the whole working tree into the sdist —
# editor settings, agent config and all. Ship only what builds and tests the app.
[tool.hatch.build.targets.sdist]
include = [
    "fast_f1_app.py",
    "tests/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
